services:
  brainslug:
    build: .
    container_name: alexa-brainslug
    env_file:
      - .env
    # Bound to loopback deliberately. The dashboard and history feed are
    # served by the same process as /alexa and have no authentication, so the
    # container must not be reachable except through a reverse proxy that
    # routes /alexa alone. See Caddyfile.example.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped

    # The filesystem is read-only apart from the database volume. The service
    # writes nothing else, so anything that tries to is a bug or an intrusion.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # A runaway provider loop should not be able to take the host with it.
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 128

    # Prompts and answers can reach the logs at debug level. Bounding the
    # files bounds how long that data lives on disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--tries=1", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
