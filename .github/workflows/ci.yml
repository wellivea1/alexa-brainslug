name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a toolchain release cannot change what CI checks without a
  # commit that says so.
  GO_VERSION: "1.26"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The race detector needs cgo, which is available on the Linux runner
      # but not on a stock Windows development machine. CI is where this
      # actually gets checked.
      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # golangci-lint is pinned as a tool dependency in go.mod, so CI and a
      # developer machine run the same version without a separate install
      # step or a version to keep in sync.
      - name: Lint
        run: go tool golangci-lint run ./...

      - name: Check formatting
        run: |
          go tool golangci-lint fmt ./...
          git diff --exit-code

      # The repository is deliberately ASCII-only. Smart quotes and dashes
      # pasted from a browser render badly in terminals and diffs, and in
      # spoken output they reach a text-to-speech voice.
      - name: Check for non-ASCII characters
        run: |
          if grep -rn -P '[^\x00-\x7F]' \
            --include='*.go' --include='*.md' --include='*.json' \
            --include='*.yml' --include='*.yaml' --include='*.example' .; then
            echo "::error::Non-ASCII characters found. Replace them with ASCII equivalents."
            exit 1
          fi

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Include *.ps1,*.psm1
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object {
                Write-Error "$($file.FullName): $($_.Message)"
              }
              exit 1
            }
          }

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag alexa-brainslug:ci .

      # A container that cannot start is a deployment that cannot start. This
      # catches listener and volume disagreements between the image and
      # Compose configuration.
      - name: Verify the container starts and serves private health
        run: |
          docker run --detach --name brainslug-ci \
            --env OPENAI_API_KEY=ci-placeholder-key \
            --env OPENAI_MODEL=gpt-5-mini \
            --publish 127.0.0.1:18080:8080 \
            --publish 127.0.0.1:18081:8081 \
            alexa-brainslug:ci

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/health; then
              echo
              echo "private health endpoint responded"
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18081/health >/dev/null

          # The public ASK listener must not expose administration even when
          # Docker publishes the whole listener port.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/health)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/history)" = "404"

      - name: Container logs
        if: always()
        run: docker logs brainslug-ci || true
